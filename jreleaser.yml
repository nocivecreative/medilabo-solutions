# Release automation native JVM (cf. ADR-09).
# Config au niveau du repo (monorepo sans POM parent) : pilotee par les tags de
# sprint vX.Y.Z-sprintN. La version est injectee par la GitHub Action via
# JRELEASER_PROJECT_VERSION (le tag sans son prefixe 'v').
project:
  name: medilabo-solutions
  description: Depistage du risque de diabete de type 2 - architecture microservices
  copyright: 2026 MedilaboSolutions
  links:
    homepage: https://github.com/nocivecreative/medilabo-solutions

release:
  github:
    owner: nocivecreative
    name: medilabo-solutions
    # Le tag est deja pousse a la main : JReleaser cree la Release dessus.
    tagName: 'v{{projectVersion}}'
    # Critere SemVer : tout tag portant un identifiant de pre-release (le segment
    # apres le '-', cf. SemVer §9) est un jalon intermediaire -> marque pre-release.
    # Couvre bootstrap, sprint1..N, rc, etc. sans enumeration a maintenir.
    # Seule la livraison finale 'v1.0.0' (sans suffixe) sortira en release stable.
    prerelease:
      pattern: .*-.*
    overwrite: true
    # On n'utilise pas de milestones. Sans ca, JReleaser tente de fermer un milestone
    # nomme comme la version -> appel API issues/milestones qui exige `issues: write`
    # (absent du token, volontairement : moindre privilege) -> 403 Forbidden.
    milestone:
      close: false
    changelog:
      formatted: ALWAYS
      # Genere les notes en regroupant les commits par type Conventional Commits.
      preset: conventional-commits
      contributors:
        enabled: false

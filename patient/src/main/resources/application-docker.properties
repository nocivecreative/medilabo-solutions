# Profil 'docker' : configuration DataSource quand patient-service tourne EN conteneur,
# sur le reseau medilabo-net. Active via SPRING_PROFILES_ACTIVE=docker (cf. docker-compose.yml).
# La base application.properties (driver, ddl-auto=validate, port 8081, actuator) reste chargee ;
# ce profil ne fait qu'apporter la DataSource adaptee au reseau Docker.

################### DataSource (conteneur) ###################
# L'hote n'est PAS localhost:3307 (ca, c'est le port PUBLIE pour l'acces depuis l'hote) :
# depuis un conteneur, on vise le NOM DU SERVICE compose `mysql` sur son port INTERNE 3306.
# Parametres caching_sha2_password identiques au profil local ; mot de passe lu dans
# l'environnement SANS valeur par defaut. Attention : cela ne protege QUE du cas
# "variable absente". Une variable PRESENTE MAIS VIDE se resout en mot de passe vide,
# sans erreur ici -> l'echec ne surgit qu'a la connexion JDBC. La garde qui couvre ce
# cas est en amont, dans docker-compose.yml (`${DB_PASSWORD:?...}`).
spring.datasource.url=jdbc:mysql://mysql:3306/medilabo_patient?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=medilabo
spring.datasource.password=${SPRING_MEDILABO_PATIENT_DB_PASSWORD}
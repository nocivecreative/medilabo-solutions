spring.application.name=patient
spring.output.ansi.enabled=ALWAYS

# Port "interne" du microservice : la gateway (8080) reste le seul point
# d'entree public, les services metier prennent des ports distincts pour
# coexister en local hors Docker. Surchargeable via SERVER_PORT.
server.port=8081

# Active automatiquement le profil "medilabo" qui apporte la config DataSource.
# Override possible via SPRING_PROFILES_ACTIVE pour tests/CI/prod.
spring.profiles.active=local

################### JPA / Hibernate ###################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
# API REST stateless avec DTO : aucun lazy loading en couche web, on libère
# la connexion dès la fin de la transaction plutôt qu'en fin de rendu HTTP.
spring.jpa.open-in-view=false

################### ACTUATOR ######################
# (OWASP A05) — on n'expose que /health, pas /env ni /configprops
management.endpoints.web.exposure.include=health

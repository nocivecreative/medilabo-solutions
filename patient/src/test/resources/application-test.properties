# Profil de test : H2 en mémoire, schéma généré par Hibernate depuis les entités.
spring.datasource.url=jdbc:h2:mem:medilabo_patient_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

################### MongoDB (conteneur) ###################
# Charge quand SPRING_PROFILES_ACTIVE=docker (cf. docker-compose.yml).
# Vise le NOM DU SERVICE compose `mongo` sur son port INTERNE 27017 (reseau medilabo-net).
# Base dediee medilabo_notes. Pas d'authentification : Mongo n'est pas publie a l'hote
# et reste joignable uniquement depuis le reseau Docker prive (auth centralisee a la gateway).
# SB 4.0 : proprietes de CONNEXION Mongo sous spring.mongodb.* (spring.data.mongodb.uri
# est deprecie niveau error -> non binde). Cf. application-local.properties.
spring.mongodb.uri=mongodb://mongo:27017/medilabo_notes

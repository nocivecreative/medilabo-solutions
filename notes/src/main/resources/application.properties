spring.application.name=notes

# Sobriete des logs : pas de banner ASCII au demarrage.
spring.main.banner-mode=off

# Port "interne" du microservice : la gateway (8080) reste le seul point d'entree
# public. patient=8081, notes=8082. Surchargeable via SERVER_PORT.
server.port=8082

# Profil par defaut en run local hors conteneur. Override via SPRING_PROFILES_ACTIVE.
spring.profiles.active=local

################### MongoDB ###################
# Creation automatique des index declares par @Indexed : desactivee par defaut
# depuis Spring Data Mongo 3.0, on la reactive explicitement (index sur patId).
spring.data.mongodb.auto-index-creation=true

# Sobriete des logs : le driver Mongo deverse tout son MongoClientSettings au demarrage.
logging.level.org.mongodb.driver=WARN

################### ACTUATOR ##################
# (OWASP A05) — on n'expose que /health, pas /env ni /configprops.
management.endpoints.web.exposure.include=health

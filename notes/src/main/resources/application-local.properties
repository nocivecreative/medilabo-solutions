################### MongoDB (run local hors conteneur) ###################
# Charge quand SPRING_PROFILES_ACTIVE=local. Vise un MongoDB joignable sur l'hote
# (ex. `docker run -p 27017:27017 mongo:7`). Base dediee medilabo_notes.
# SB 4.0 : les proprietes de CONNEXION Mongo ont migre de spring.data.mongodb.* vers
# spring.mongodb.* (spring.data.mongodb.uri est deprecie niveau error -> inerte).
spring.mongodb.uri=mongodb://localhost:27017/medilabo_notes

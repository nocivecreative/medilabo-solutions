server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des réponses texte (Green Code / RGESN 7.2).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Consigne client : "il n'y a pas de limite quant à la taille des notes qu'un
    # médecin peut ajouter". Sans cette directive, nginx plafonne le corps des
    # requêtes à 1 Mo par défaut et renverrait 413 avant même d'atteindre la gateway.
    # 16 Mo = plafond réel d'un document MongoDB (BSON) : au-delà, c'est la base qui
    # refuserait, pas une limite artificielle du reverse proxy.
    client_max_body_size 16m;

    # API : proxy vers la gateway. Le `/` final de proxy_pass strippe le préfixe /api
    # (/api/patients -> http://gateway:8080/patients). Même origine pour le navigateur
    # (http://localhost/) -> pas de CORS.
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets hashés par le build Angular (bundles à la racine, polices sous media/) :
    # le nom porte le hash du contenu, donc le fichier est immuable — le navigateur
    # n'a jamais à le revalider.
    location ~* "-[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html référence les noms hashés : il doit être revalidé à chaque visite,
    # sinon un déploiement resterait invisible.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback : toute route inconnue (deep-link Angular) renvoie index.html,
    # le routing reprend la main côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

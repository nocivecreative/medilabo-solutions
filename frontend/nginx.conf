server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des réponses texte (Green Code / RGESN 7.2).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API : proxy vers la gateway. Le `/` final de proxy_pass strippe le préfixe /api
    # (/api/patients -> http://gateway:8080/patients). Même origine pour le navigateur
    # (http://localhost/) -> pas de CORS.
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback : toute route inconnue (deep-link Angular) renvoie index.html,
    # le routing reprend la main côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

spring.application.name=risk
spring.output.ansi.enabled=ALWAYS

# Port "interne" du microservice. patient=8081, notes=8082, risk=8083.
server.port=8083

# Profil par defaut en run local hors conteneur. Override via SPRING_PROFILES_ACTIVE.
spring.profiles.active=local

################### ACTUATOR ##################
# (OWASP A05) — on n'expose que /health.
management.endpoints.web.exposure.include=health

################### CALCUL DE RISQUE ##################
# Termes declencheurs a rechercher dans les notes. EXTERNALISES (pas en dur) pour
# rester extensibles : le brief donne une liste ouverte ("..."). Fournis en RADICAUX
# normalises (minuscules, sans accents) -> le matching gere singulier/pluriel et casse.
#  - "fumeu" capte "fumeur" et "fumeuse"
#  - "vertige" capte "vertige" et "vertiges"
#  - "anormal" capte "anormal", "anormale", "anormales"
medilabo.risk.triggers=hemoglobine a1c,microalbumine,taille,poids,fumeu,anormal,cholesterol,vertige,rechute,reaction,anticorps

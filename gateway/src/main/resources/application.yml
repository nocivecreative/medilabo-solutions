server:
  # Seul port public de la stack : la gateway est l'unique point d'entree.
  # Les microservices metier ecoutent sur des ports distincts (patient=8081, ...).
  port: 8080

spring:
  application:
    name: gateway
  # Base d'authentification dediee (schema medilabo_auth, distinct de patient).
  # Acces R2DBC (non-bloquant, obligatoire sur une gateway reactive).
  # sslMode=PREFERRED : MySQL 8.4 utilise caching_sha2_password, dont le handshake
  # exige TLS ou la cle publique RSA du serveur. Le driver io.asyncer (1.4.1)
  # n'expose ni allowPublicKeyRetrieval ni rsaPublicKey -> le TLS est la seule voie.
  # PREFERRED est deja le defaut du driver en TCP ; on le garde explicite pour
  # documenter l'intention. Cert auto-signe accepte sans verification (OK en local
  # et reseau Docker prive) ; en prod, viser VERIFY_CA avec un certificat de confiance.
  # En Docker : surcharger AUTH_DB_URL vers le service mysql.
  r2dbc:
    url: ${AUTH_DB_URL:r2dbc:mysql://localhost:3307/medilabo_auth?sslMode=PREFERRED}
    username: ${AUTH_DB_USER:medilabo}
    # Secret propre a la base auth, distinct de celui du patient.
    password: ${SPRING_MEDILABO_AUTH_DB_PASSWORD}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Sprint 1 : routage vers patient-service.
            # En Docker, surcharger PATIENT_SERVICE_URI=http://patient:8081
            # (nom DNS du service docker-compose). Pas de StripPrefix :
            # le controller patient expose deja /patients.
            - id: patient
              uri: ${PATIENT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/patients/**

# Les utilisateurs sont geres directement en base (medilabo_auth) : la gateway
# est un pur lecteur, aucun amorcage cote application.

management:
  endpoints:
    web:
      exposure:
        # On n'expose que /health (sonde orchestrateur), pas /env ni /configprops.
        include: health

server:
  # Seul port public de la stack : la gateway est l'unique point d'entree.
  # Les microservices metier ecoutent sur des ports distincts (patient=8081, ...).
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Sprint 1 : routage vers patient-service.
            # En Docker, surcharger PATIENT_SERVICE_URI=http://patient:8081
            # (nom DNS du service docker-compose). Pas de StripPrefix :
            # le controller patient expose deja /patients.
            - id: patient
              uri: ${PATIENT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/patients/**

# Authentification centralisee (cf. ADR-03 : Basic Auth + InMemoryUserDetailsManager).
# Identifiants surchargeables par variables d'environnement en Docker/prod.
medilabo:
  security:
    username: ${GATEWAY_USER:praticien}
    password: ${GATEWAY_PASSWORD:medilabo}

management:
  endpoints:
    web:
      exposure:
        # On n'expose que /health (sonde orchestrateur), pas /env ni /configprops.
        include: health
